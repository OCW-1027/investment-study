<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>연상 사고 개발 — 투자 스터디</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#1B2836; --muted:#5E6E80;
  --accent:#2F4E8C; --accent-ink:#FFFFFF; --accent-soft:#E8EDF6;
  --line:#D9E0E8; --shadow:0 1px 3px rgba(27,40,54,.08),0 8px 28px rgba(27,40,54,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --surface:#192029; --ink:#E7ECF2; --muted:#94A2B2;
    --accent:#82A0DC; --accent-ink:#10151C; --accent-soft:#223048;
    --line:#2A3441; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#192029; --ink:#E7ECF2; --muted:#94A2B2;
  --accent:#82A0DC; --accent-ink:#10151C; --accent-soft:#223048;
  --line:#2A3441; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.3);
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans KR',-apple-system,'Hiragino Sans','Noto Sans KR',sans-serif;
  line-height:1.65; font-size:15.5px; -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);
  max-width:560px; width:100%; padding:38px 34px 30px}
.kicker{font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.16em; color:var(--muted);
  text-transform:uppercase; margin-bottom:12px}
h1{font-family:'Gowun Batang',serif; font-size:clamp(26px,5vw,34px); font-weight:700; letter-spacing:-.01em; text-wrap:balance}
p.sub{color:var(--muted); margin-top:12px; font-size:14.5px}
.flow{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:20px;
  font-family:'IBM Plex Mono',monospace; font-size:12px}
.fnode{background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:3px 11px}
.fnode.hot{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.farr{color:var(--muted)}
.links{display:flex; flex-direction:column; gap:10px; margin-top:26px}
a.go{display:flex; align-items:center; gap:12px; text-decoration:none; border:1.5px solid var(--line);
  border-radius:12px; padding:14px 18px; color:var(--ink); background:var(--bg); transition:border-color .15s,transform .15s}
a.go:hover{border-color:var(--accent); transform:translateY(-1px)}
a.go:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
a.go .lang{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; color:var(--accent);
  background:var(--accent-soft); border-radius:6px; padding:3px 9px; white-space:nowrap}
a.go .t{font-weight:700; flex:1}
a.go .t small{display:block; font-weight:400; font-size:12.5px; color:var(--muted); margin-top:2px}
a.go .arr{color:var(--muted); font-family:'IBM Plex Mono',monospace}
a.go.sub{padding:10px 18px}
a.go.sub .t{font-weight:500;font-size:14px}
.note{margin-top:22px; padding-top:16px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--muted)}
.note b{color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em}
</style>
</head>
<body>
<div class="card">
  <div class="kicker">Input → Association → Judgment → Invest</div>
  <h1>연상 사고 개발</h1>
  <p class="sub">뉴스 하나가 들어오면 자산 전체에 화살표가 자동으로 그려지는 상태를 만드는 훈련장.
  매 영업일 아침 연상 브리핑이 자동으로 갱신됩니다.</p>
  <div class="flow">
    <span class="fnode">인풋</span><span class="farr">→</span>
    <span class="fnode hot">연상게임</span><span class="farr">→</span>
    <span class="fnode">안목</span><span class="farr">→</span>
    <span class="fnode">투자</span>
  </div>

  <div class="links">
    <a class="go" href="https://claude.ai/code/artifact/aacde067-0561-4c71-b429-4050b4946add">
      <span class="lang">KO</span>
      <span class="t">한국어판 열기<small>오늘의 브리핑 · 연상 지도 · 커머디티 심화 · 드릴</small></span>
      <span class="arr">→</span>
    </a>
    <a class="go sub" href="jp.html">
      <span class="lang">JA</span>
      <span class="t">日本語版</span>
      <span class="arr">→</span>
    </a>
  </div>

  <div class="note"><b>NOTE</b> — 본 자료는 학습 목적이며 특정 종목의 매수·매도 추천이 아닙니다. 투자 판단의 최종 책임은 본인에게 있습니다.</div>
</div>
</body>
</html>
